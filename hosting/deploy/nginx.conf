# nginx server block for KDC 2026 (static files). Adjust server_name, root and certificate paths.
server {
  listen 80;
  listen [::]:80;
  server_name kdc.example.org;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name kdc.example.org;

  ssl_certificate     /etc/letsencrypt/live/kdc.example.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/kdc.example.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  root /var/www/kdc-dallas;
  index index.html;
  server_tokens off;
  charset utf-8;

  # Only allow reading files
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  types { application/manifest+json webmanifest; }

  gzip on;
  gzip_types text/css application/javascript application/manifest+json image/svg+xml;

  add_header Content-Security-Policy 'default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://i.ytimg.com; font-src 'self'; connect-src 'self'; media-src 'self'; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests; require-trusted-types-for 'script'; trusted-types kdc' always;
  add_header Strict-Transport-Security 'max-age=31536000; includeSubDomains' always;
  add_header X-Content-Type-Options 'nosniff' always;
  add_header X-Frame-Options 'DENY' always;
  add_header Referrer-Policy 'strict-origin-when-cross-origin' always;
  add_header Permissions-Policy 'accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), browsing-topics=(), autoplay=(self "https://www.youtube-nocookie.com"), fullscreen=(self "https://www.youtube-nocookie.com"), picture-in-picture=(self "https://www.youtube-nocookie.com")' always;
  add_header Cross-Origin-Opener-Policy 'same-origin' always;
  add_header Cross-Origin-Resource-Policy 'same-origin' always;
  add_header Origin-Agent-Cluster '?1' always;
  add_header X-Permitted-Cross-Domain-Policies 'none' always;

  location ~ /\.(?!well-known) { deny all; }

  location = /sw.js { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/kdc-security.conf; }
  location ~* \.(html|js|css|webmanifest)$ { add_header Cache-Control "no-cache"; include /etc/nginx/snippets/kdc-security.conf; }
  location ~* \.woff2$ { add_header Cache-Control "public, max-age=31536000, immutable"; include /etc/nginx/snippets/kdc-security.conf; }
  location ~* \.(webp|png|jpg|svg)$ { add_header Cache-Control "public, max-age=604800"; include /etc/nginx/snippets/kdc-security.conf; }

  location / { try_files $uri $uri/ =404; }
  error_page 404 /404.html;
}

# NOTE: nginx drops server-level add_header lines inside a location that has its own add_header.
# So copy the security add_header lines above into /etc/nginx/snippets/kdc-security.conf as well.
